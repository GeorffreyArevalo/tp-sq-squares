server:
  port: 8081
  servlet:
    context-path: /api/v1

spring:
  application:
    name: square
  datasource:
    url: jdbc:postgresql://localhost:5433/square
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

feign:
  client:
    user-service:
      url: http://localhost:8080/api/v1
