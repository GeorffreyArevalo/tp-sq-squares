server:
  port: 8081
  servlet:
    context-path: /api/v1

spring:
  application:
    name: square
  datasource:
    url: jdbc:postgresql://localhost:5433/square
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  jackson:
    default-property-inclusion: non_null

security:
  jwt:
    public-key: ${PUBLIC_KEY}

feign:
  client:
    user-service:
      url: http://localhost:8080/api/v1
    notification-service:
      url: http://localhost:8082/api/v1
    traceability-service:
      url: http://localhost:8083/api/v1
